@if (nextPresc(); as presc) {
  <!-- Cambiado mb-4 por m-0 y añadido h-100 junto a flexbox interno -->
  <div class="card border-0 rounded-4 bg-primary bg-opacity-10 h-100 m-0">
    <div class="card-body py-2 px-3 d-flex flex-column justify-content-between h-100">

      <!-- Bloque Superior: Icono e Información -->
      <div class="d-flex align-items-center mb-2">
        <div class="bg-primary rounded-circle d-flex justify-content-center align-items-center me-3 flex-shrink-0"
          style="width:48px; height:48px;">
          <i class="fa-solid fa-capsules fs-4 text-white"></i>
        </div>
        <div>
          <small class="text-primary fw-semibold text-uppercase" style="font-size: 0.75rem; letter-spacing: 0.5px;">Próxima toma</small>
          <h6 class="fw-bold text-dark m-0 lh-sm" style="font-size: 0.95rem;">
            {{ presc.name }} <br>
            <span class="text-muted fw-normal" style="font-size: 0.8rem;">{{ presc.apply }}</span>
          </h6>
        </div>
      </div>

      <!-- Bloque Inferior: Cuenta regresiva y Botón de acción -->
      <div class="d-flex justify-content-between align-items-center mt-1">
        <span class="fw-bold text-primary" style="font-size: 0.9rem;">
          <i class="fa-regular fa-clock me-1"></i> En {{ countdown() }}
        </span>

        @if (isTake()) {
          <button class="btn btn-primary rounded-pill px-2 py-1 fw-bold btn-sm shadow-sm">
            <i class="fa-solid fa-circle-check me-1"></i>Tomar ahora
          </button>
        }
      </div>

    </div>
  </div>
}
