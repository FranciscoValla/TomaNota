@if (utilityService.isLoad()) {
  <div class="position-fixed top-0 start-0 w-100 h-100 bg-white d-flex flex-column justify-content-center align-items-center"
       style="z-index: 10000;">
    <div class="text-center">
      <div class="spinner-border text-primary" role="status" style="width: 3.5rem; height: 3.5rem;">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <h5 class="mt-3 text-secondary fw-semibold">Cargando...</h5>
    </div>
  </div>
}
<!-- NAV TOP - solo móvil -->
<nav id="topNav" class="navbar fixed-top bg-white border-bottom shadow-sm d-md-none p-0"
  [style.transform]="isHidden()? 'translateY(-100%)' : 'translateY(0)'"
  style="height:52px; transition: transform.3s ease;">
  <div class="container-fluid d-flex justify-content-around align-items-center h-100">
    <a class="nav-link text-center py-1" routerLink="/notes" routerLinkActive="text-primary">
      <i class="fa-regular fa-clipboard d-block fs-6"></i>
      <small style="font-size:10px" class="fw-bold">Notas</small>
    </a>
    <a class="nav-link text-center py-1 text-secondary" routerLink="/prescription" routerLinkActive="text-primary">
      <i class="fa-solid fa-capsules d-block fs-6" style="color:#ff8c00"></i>
      <small style="font-size:10px">Recetas</small>
    </a>
    <a class="nav-link text-center py-1 text-secondary" routerLink="/bin" routerLinkActive="text-primary">
      <i class="fa-regular fa-trash-can d-block fs-6"></i>
      <small style="font-size:10px">Papelera</small>
    </a>
    <a class="nav-link text-center py-1 text-secondary" routerLink="/history" routerLinkActive="text-primary">
      <i class="fa-solid fa-clock-rotate-left d-block fs-6"></i>
      <small style="font-size:10px">Historial</small>
    </a>
  </div>
</nav>

<!-- NAV LEFT - solo desktop -->
<nav class="d-none d-md-flex flex-column position-fixed top-0 start-0 h-100 bg-white border-end shadow-sm p-2"
  style="width:80px; z-index:1030;">
  <a class="nav-link text-center py-3" routerLink="/notes" routerLinkActive="text-primary"><i
      class="fa-regular fa-clipboard d-block fs-5"></i><small>Notas</small></a>
  <a class="nav-link text-center py-3 text-secondary" routerLink="/prescription" routerLinkActive="text-primary"><i
      class="fa-solid fa-capsules d-block fs-5" style="color:#ff8c00"></i><small>Record.</small></a>
  <a class="nav-link text-center py-3 text-secondary" routerLink="/bin" routerLinkActive="text-primary"><i
      class="fa-regular fa-trash-can d-block fs-5"></i><small>Papelera</small></a>
  <a class="nav-link text-center py-3 text-secondary" routerLink="/history" routerLinkActive="text-primary"><i
      class="fa-solid fa-clock-rotate-left d-block fs-5"></i><small>Historial</small></a>
</nav>

<!-- Contenido -->
<div class="d-md-none" style="height:52px"></div>
<div [style.margin-left]=" '0' " class="content-wrapper" [class.ms-md-80]="true">
  <router-outlet />
</div>
